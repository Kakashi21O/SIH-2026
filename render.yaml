services:
  - type: web
    name: safesteps
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: SafeSteps
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DEFAULT_PIN
        value: "1234"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/safesteps.db
    disk:
      name: safesteps-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
